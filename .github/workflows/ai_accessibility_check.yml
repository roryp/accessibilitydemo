name: AI Accessibility Check

# Uses the GitHub Copilot SDK (https://github.com/github/copilot-sdk) for AI analysis.
# Authentication (either option):
#   - Personal repos: add a COPILOT_GITHUB_TOKEN repository secret containing a fine-grained
#     PAT with the "Copilot Requests" permission (account must have a Copilot subscription).
#   - Organization repos: no secret needed if the org enables "Allow use of Copilot CLI billed
#     to the organization"; the built-in GITHUB_TOKEN with copilot-requests: write is used.
# Without Copilot authentication, the workflow runs in mock analysis mode.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  pull-requests: write
  issues: write
  copilot-requests: write

jobs:
  ai-accessibility-check:
    name: AI-Powered Accessibility Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Check for COPILOT_GITHUB_TOKEN (optional)
        run: |
          if [ -z "${{ secrets.COPILOT_GITHUB_TOKEN }}" ]; then
            echo "::notice::COPILOT_GITHUB_TOKEN secret is not configured. Falling back to the built-in GITHUB_TOKEN (org repos only); otherwise mock analysis mode is used."
          else
            echo "::notice::COPILOT_GITHUB_TOKEN found. Running with full AI analysis."
          fi

      - name: Run AI accessibility analysis
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
        run: |
          python ai_accessibility_analyzer.py

      - name: Display AI analysis results
        run: |
          echo "=== AI Accessibility Analysis Results ==="
          if [ -f ai_accessibility_report.md ]; then
            cat ai_accessibility_report.md
          else
            echo "No report generated"
          fi

      - name: Upload AI analysis results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-accessibility-analysis
          path: |
            ai_accessibility_results.json
            ai_accessibility_report.md
